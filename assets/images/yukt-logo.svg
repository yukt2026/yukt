<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="100%" height="100%">
  <!-- Icon Group -->
  <g transform="translate(6, 6)">
    <!-- Outer subtle hexagonal tech ring (optional minimalist mark) -->
    <rect x="0" y="0" width="52" height="52" rx="12" fill="#0B132B"/>
    
    <!-- Geometric 'Y' Emblem -->
    <!-- Left Branch -->
    <path d="M16 14L26 26" stroke="#0066FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Branch -->
    <path d="M36 14L26 26" stroke="#60A5FA" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center Stem -->
    <path d="M26 26V39" stroke="#0066FF" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Accent Orange Spark Node -->
    <circle cx="26" cy="26" r="3.5" fill="#EA580C" />
    <!-- Secondary Precision Dots -->
    <circle cx="16" cy="14" r="2.5" fill="#FFFFFF" />
    <circle cx="36" cy="14" r="2.5" fill="#EA580C" />
    <circle cx="26" cy="39" r="2.5" fill="#60A5FA" />
  </g>

  <!-- Wordmark Text Group -->
  <g transform="translate(70, 20)">
    <!-- YUKT Primary Text -->
    <text x="0" y="20" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.03em" fill="#0B132B">YUKT</text>
    
    <!-- Subtle Orange Accent Dot on Logo -->
    <circle cx="68" cy="10" r="3" fill="#EA580C" />

    <!-- Subtitle: IT SOLUTIONS -->
    <text x="0" y="34" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.22em" fill="#64748B">IT SOLUTIONS</text>
  </g>
</svg>
